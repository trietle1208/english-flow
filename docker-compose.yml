services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: english_learning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Named volume, declared below — data survives `docker compose down`.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/english_learning
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      # Dev-only value, same spirit as the hardcoded postgres creds above —
      # not for production use. Generated with: openssl rand -base64 32
      BETTER_AUTH_SECRET: KyLJzoXpcib4V9Adot6qtRdbzELvb8g09IDopuYmptg=

  # Dev-only DB admin UI at http://localhost:8081 (System: PostgreSQL,
  # Server: postgres, User/Pass: postgres, Database: english_learning).
  # Host port 8081 avoids clash with other local stacks that bind 8080.
  # Not something a production deploy needs — feel free to drop this
  # service (or run `docker compose up -d` without it via --scale
  # adminer=0) outside local dev.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"

volumes:
  pgdata:
